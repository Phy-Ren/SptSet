# gaplint configuration for SptSet
# See https://github.com/james-d-mitchell/gaplint for all rules

columns: 100  # Allow slightly longer lines for mathematical expressions

# Disable some noisy rules for now (can be enabled later as code is cleaned up)
disable:
  - W004   # align-assignments - too noisy for existing code
  - W005   # align-trailing-comments - too strict
  - W006   # align-comments - too strict
  - W034   # 1-line-function - style preference, not a bug
  # Operator whitespace rules - disabled to keep mathematical expressions compact
  # e.g., "1/2" is clearer than "1 / 2" for fractions in physics code
  - W020   # whitespace-op-plus
  - W021   # whitespace-op-multiply
  - W022   # whitespace-op-negative
  - W023   # whitespace-op-less-than (used in mathematical comparisons)
  - W029   # whitespace-op-divide
  - W030   # whitespace-op-power
  - W031   # whitespace-op-not-equal
  - W032   # whitespace-double-dot
